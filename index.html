<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPQ 11 - Patrol</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CPQ 11">
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22CPQ%2011%20-%20Patrol%22%2C%22short_name%22%3A%22CPQ11%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4f6f9%22%2C%22theme_color%22%3A%22%231e293b%22%2C%22orientation%22%3A%22portrait%22%7D">

    <style>
        /* Variáveis para suporte a Dark Mode */
        :root {
            --bg-body: #f4f6f9;
            --bg-card: white;
            --bg-linha: #f8fafc;
            --border-linha: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-hora: #0f172a;
            --hist-sala: #334155;
            --bg-obs: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-linha: #334155;
            --border-linha: #475569;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-hora: #f8fafc;
            --hist-sala: #cbd5e1;
            --bg-obs: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            padding: 20px 15px;
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 10px 0;
        }

        .header-texto {
            text-align: left;
        }

        header h1 {
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 4px;
            font-weight: 700;
        }

        header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* --- ESTILO DO SWITCH --- */
        .theme-switch-wrapper {
            display: inline-flex;
        }
        .theme-switch {
            position: relative;
            display: inline-block;
            width: 56px;
            height: 30px;
            cursor: pointer;
        }
        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e293b;
            border-radius: 30px;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
        }
        .slider::before {
            position: absolute;
            content: "";
            height: 24px;
            width: 24px;
            left: 3px;
            bottom: 3px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }
        
        input:checked + .slider { background-color: #ffffff; }
        input:checked + .slider::before {
            transform: translateX(26px);
            background-color: #0f172a;
        }

        /* --- CARD E LINHAS DE SALAS --- */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .section-title {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lista-botoes-verticais {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .wrapper-linha {
            background: var(--bg-linha);
            border-radius: 8px;
            border: 1px solid var(--border-linha);
            overflow: hidden;
            transition: background 0.3s, border 0.3s;
        }

        .linha-sala {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            gap: 6px;
        }

        .btn-sala {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.15);
            text-align: left;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-sala:active {
            background-color: #1d4ed8;
            transform: scale(0.98);
        }

        .btn-sala:disabled {
            background-color: var(--border-linha) !important;
            color: var(--text-secondary) !important;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.65;
            transform: none !important;
        }

        .wrapper-linha[data-sala="END TIME"] .btn-sala {
            background-color: #475569;
        }
        .wrapper-linha[data-sala="END TIME"] .btn-sala:active {
            background-color: #334155;
        }

        .mostrador-horario {
            text-align: right;
            padding-right: 4px;
            min-width: 65px;
        }

        .hora-atual {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-hora);
        }

        .data-atual {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .sem-registro-sala {
            font-size: 14px;
            color: #94a3b8;
            font-style: italic;
        }

        /* --- BOTÃO MAIS / EDITAR OBSERVAÇÃO --- */
        .btn-abrir-obs {
            background-color: transparent;
            border: 1px dashed #94a3b8;
            color: var(--text-primary);
            width: 34px;
            height: 34px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-abrir-obs:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .btn-abrir-obs.tem-obs {
            border-style: solid;
            background-color: #3b82f61a;
            border-color: #2563eb;
            color: #2563eb;
        }

        /* --- CAIXA DE TEXTO DA OBSERVAÇÃO --- */
        .painel-obs {
            display: none;
            padding: 10px;
            background: var(--bg-obs);
            border-top: 1px solid var(--border-linha);
        }

        .painel-obs.ativo {
            display: block;
        }

        .obs-input-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-obs {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-linha);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }

        .input-obs:focus {
            border-color: #2563eb;
        }

        .btn-icon-action {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-icon-action:active {
            opacity: 0.8;
        }

        .btn-salvar-obs {
            background-color: #10b981;
            color: white;
        }

        .btn-cancelar-obs {
            background-color: #ef4444;
            color: white;
        }

        .obs-contador {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
            text-align: right;
        }

        .texto-obs-salva {
            font-size: 12px;
            color: #2563eb;
            font-style: italic;
            margin-top: 4px;
            word-break: break-word;
        }

        [data-theme="dark"] .texto-obs-salva {
            color: #60a5fa;
        }

        /* --- AÇÕES SECUNDÁRIAS --- */
        .acoes-secundarias {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .btn-whats { background-color: #25d366; color: white; }
        .btn-whats:active { background-color: #128c7e; }
        .btn-limpar { background-color: #ef4444; color: white; }
        .btn-limpar:active { background-color: #dc2626; }

        .lista-registros {
            max-height: 250px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .item-registro {
            display: flex;
            flex-direction: column;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-linha);
            font-size: 14px;
        }

        .item-registro-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-registro:last-child { border-bottom: none; }
        .info-sala-hist { font-weight: 500; color: var(--hist-sala); }
        .info-hora-hist { font-weight: 600; color: #2563eb; }
        .info-obs-hist { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    </style></head><body>

    <div class="container">
        <header>
            <div class="header-texto">
                <h1>CPQ 11 - Patrol</h1>
                <p>Toque no botão para registrar a entrada na sala</p>
            </div>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox-tema">
                    <input type="checkbox" id="checkbox-tema" />
                    <div class="slider"></div>
                </label>
            </div>
        </header>

        <div class="card">
            <div class="section-title">Salas e Dependências</div>
            <div class="lista-botoes-verticais" id="container-salas"></div>
        </div>

        <div class="card">
            <div class="section-title">Histórico de Cliques (Geral)</div>
            <div class="lista-registros" id="lista-registros"></div>
            
            <div class="acoes-secundarias">
                <button class="btn-action btn-whats" onclick="enviarWhatsApp()">Enviar p/ WhatsApp</button>
                <button class="btn-action btn-limpar" onclick="limparTudo()">Limpar Tudo</button>
            </div>
        </div>
    </div>

    <script>
        const listaSalas = [
            "Start", "SOC", "LOBBY", "CE SHOP", "SECURE STORAGE", 
            "HIGH-VALUE", "LOADING DOCK", "ER1", "GEN STORAGE", "SHRED", 
            "Cable Storage", "FCR", "SER ROOM", "OPEN OFFICE", "BREAKROOM", 
            "ER2", "COLO 1", "COLO 2", "COLO 3", "END TIME"
        ];

        document.addEventListener("DOMContentLoaded", iniciarApp);

        function iniciarApp() {
            renderizarEstruturaSalas();
            carregarDados();
            inicializarTema();
            registrarServiceWorkerFalso();
        }

        function inicializarTema() {
            const checkboxTema = document.getElementById('checkbox-tema');
            const temaSalvo = localStorage.getItem('app_theme') || 'light';

            if(temaSalvo === 'dark'){
                document.documentElement.setAttribute('data-theme', 'dark');
                checkboxTema.checked = true;
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                checkboxTema.checked = false;
            }

            checkboxTema.addEventListener('change', (e) => {
                if(e.target.checked) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('app_theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                    localStorage.setItem('app_theme', 'light');
                }
            });
        }

        function getSalaId(sala) {
            return btoa(unescape(encodeURIComponent(sala))).replace(/=/g, '');
        }

        // Função auxiliar para formatar a hora sem segundos (HH:MM)
        function formatarHoraSemSegundos(dateObj) {
            return dateObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function renderizarEstruturaSalas() {
            const container = document.getElementById('container-salas');
            container.innerHTML = '';

            listaSalas.forEach(sala => {
                const salaId = getSalaId(sala);
                const wrapper = document.createElement('div');
                wrapper.className = 'wrapper-linha';
                wrapper.setAttribute('data-sala', sala);

                wrapper.innerHTML = `
                    <div class="linha-sala">
                        <button class="btn-sala" onclick="registrarAcesso('${sala}', event)">${sala}</button>
                        
                        <div class="mostrador-horario" id="mostrador-${salaId}">
                            <span class="sem-registro-sala">--:--</span>
                        </div>

                        <button class="btn-abrir-obs" id="btn-obs-${salaId}" title="Adicionar Observação" onclick="togglePainelObs('${salaId}')">+</button>
                    </div>

                    <div class="painel-obs" id="painel-${salaId}">
                        <div class="obs-input-container">
                            <input type="text" class="input-obs" id="input-${salaId}" maxlength="100" placeholder="Observação (máx 100 caracteres)..." oninput="atualizarContador('${salaId}')" />
                            <button class="btn-icon-action btn-salvar-obs" title="Salvar" onclick="salvarObservacao('${sala}', '${salaId}')">💾</button>
                            <button class="btn-icon-action btn-cancelar-obs" title="Cancelar" onclick="fecharPainelObs('${salaId}')">✖</button>
                        </div>
                        <div class="obs-contador" id="contador-${salaId}">0/100</div>
                        <div class="texto-obs-salva" id="obs-salva-${salaId}"></div>
                    </div>
                `;
                container.appendChild(wrapper);
            });
        }

        function togglePainelObs(salaId) {
            const painel = document.getElementById(`painel-${salaId}`);
            if (painel.classList.contains('ativo')) {
                fecharPainelObs(salaId);
            } else {
                painel.classList.add('ativo');
                const input = document.getElementById(`input-${salaId}`);
                input.focus();
            }
        }

        function fecharPainelObs(salaId) {
            const painel = document.getElementById(`painel-${salaId}`);
            painel.classList.remove('ativo');
        }

        function atualizarContador(salaId) {
            const input = document.getElementById(`input-${salaId}`);
            const contador = document.getElementById(`contador-${salaId}`);
            contador.textContent = `${input.value.length}/100`;
        }

        function salvarObservacao(nomeSala, salaId) {
            const input = document.getElementById(`input-${salaId}`);
            const textoObs = input.value.trim();

            let ultimosAcessos = JSON.parse(localStorage.getItem('v2_ultimos_acessos')) || {};
            
            if (!ultimosAcessos[nomeSala]) {
                ultimosAcessos[nomeSala] = { hora: null, data: null, obs: textoObs };
            } else {
                ultimosAcessos[nomeSala].obs = textoObs;
            }

            localStorage.setItem('v2_ultimos_acessos', JSON.stringify(ultimosAcessos));
            
            fecharPainelObs(salaId);
            atualizarMostradoresLaterais(ultimosAcessos);

            let historico = JSON.parse(localStorage.getItem('v2_historico_geral')) || [];
            mostrarHistóricoGeral(historico);
        }

        function registrarAcesso(nomeSala, event) {
            const agora = new Date();
            const dataFormatada = agora.toLocaleDateString('pt-BR');
            const horaFormatada = formatarHoraSemSegundos(agora);

            let ultimosAcessos = JSON.parse(localStorage.getItem('v2_ultimos_acessos')) || {};
            const obsExistente = ultimosAcessos[nomeSala] ? (ultimosAcessos[nomeSala].obs || '') : '';

            const novoRegistro = {
                data: dataFormatada,
                hora: horaFormatada,
                sala: nomeSala,
                obs: obsExistente,
                timestamp: agora.getTime()
            };

            let historico = JSON.parse(localStorage.getItem('v2_historico_geral')) || [];
            historico.unshift(novoRegistro);
            localStorage.setItem('v2_historico_geral', JSON.stringify(historico));

            ultimosAcessos[nomeSala] = { 
                hora: horaFormatada, 
                data: dataFormatada,
                obs: obsExistente 
            };
            localStorage.setItem('v2_ultimos_acessos', JSON.stringify(ultimosAcessos));

            atualizarMostradoresLaterais(ultimosAcessos);
            mostrarHistóricoGeral(historico);

            if (event && event.target) {
                event.target.disabled = true;
            }

            if (navigator.vibrate) { navigator.vibrate(35); }
        }

        function atualizarMostradoresLaterais(ultimosAcessos) {
            listaSalas.forEach(sala => {
                const salaId = getSalaId(sala);
                const elemento = document.getElementById(`mostrador-${salaId}`);
                const btnObs = document.getElementById(`btn-obs-${salaId}`);
                const obsSalvaElem = document.getElementById(`obs-salva-${salaId}`);
                const inputObs = document.getElementById(`input-${salaId}`);

                const dados = ultimosAcessos[sala];

                if (dados) {
                    if (dados.hora) {
                        // Trata dados legados que porventura guardavam os segundos
                        let horaLimpa = dados.hora.length > 5 ? dados.hora.substring(0, 5) : dados.hora;
                        elemento.innerHTML = `
                            <div class="hora-atual">${horaLimpa}</div>
                            <div class="data-atual">${dados.data}</div>
                        `;
                        
                        const wrapper = elemento.closest('.wrapper-linha');
                        if (wrapper) {
                            const botao = wrapper.querySelector('.btn-sala');
                            if (botao) botao.disabled = true;
                        }
                    }

                    if (dados.obs) {
                        btnObs.innerHTML = '✏️';
                        btnObs.classList.add('tem-obs');
                        btnObs.title = "Editar Observação";
                        obsSalvaElem.textContent = `Obs: ${dados.obs}`;
                        if (inputObs && document.activeElement !== inputObs) {
                            inputObs.value = dados.obs;
                            atualizarContador(salaId);
                        }
                    } else {
                        btnObs.innerHTML = '+';
                        btnObs.classList.remove('tem-obs');
                        btnObs.title = "Adicionar Observação";
                        obsSalvaElem.textContent = '';
                    }
                }
            });
        }

        function mostrarHistóricoGeral(historico) {
            const containerLista = document.getElementById('lista-registros');
            containerLista.innerHTML = '';

            if (historico.length === 0) {
                containerLista.innerHTML = '<div class="sem-registros" style="text-align:center; color:#94a3b8; padding:15px; font-style:italic;">Nenhum clique registrado.</div>';
                return;
            }

            historico.forEach(registro => {
                const item = document.createElement('div');
                item.className = 'item-registro';
                
                let obsHtml = registro.obs ? `<div class="info-obs-hist">📝 <i>${registro.obs}</i></div>` : '';
                let horaLimpa = registro.hora.length > 5 ? registro.hora.substring(0, 5) : registro.hora;

                item.innerHTML = `
                    <div class="item-registro-topo">
                        <div class="info-sala-hist">${registro.sala}</div>
                        <div class="info-hora-hist">${horaLimpa} <span style="font-size:10px; color:#94a3b8; font-weight:normal;">(${registro.data})</span></div>
                    </div>
                    ${obsHtml}
                `;
                containerLista.appendChild(item);
            });
        }

        function carregarDados() {
            let historico = JSON.parse(localStorage.getItem('v2_historico_geral')) || [];
            let ultimosAcessos = JSON.parse(localStorage.getItem('v2_ultimos_acessos')) || {};
            
            atualizarMostradoresLaterais(ultimosAcessos);
            mostrarHistóricoGeral(historico);
        }

        function limparTudo() {
            if (confirm("Deseja realmente zerar todos os horários e o histórico?")) {
                localStorage.removeItem('v2_historico_geral');
                localStorage.removeItem('v2_ultimos_acessos');
                renderizarEstruturaSalas();
                mostrarHistóricoGeral([]);
            }
        }

        /* Envio do WhatsApp com Horários e Observações Separados */
        function enviarWhatsApp() {
            let ultimosAcessos = JSON.parse(localStorage.getItem('v2_ultimos_acessos')) || {};
            let linhasHorarios = [];
            let linhasObs = [];
            const espacamentoFixo = 16; 

            listaSalas.forEach(sala => {
                if (ultimosAcessos[sala] && ultimosAcessos[sala].hora) {
                    let horaLimpa = ultimosAcessos[sala].hora.length > 5 ? ultimosAcessos[sala].hora.substring(0, 5) : ultimosAcessos[sala].hora;
                    const pontosFaltantes = espacamentoFixo - sala.length;
                    const espacos = " ".repeat(pontosFaltantes > 0 ? pontosFaltantes : 1);
                    
                    linhasHorarios.push(`${sala}:${espacos}${horaLimpa}`);

                    if (ultimosAcessos[sala].obs) {
                        linhasObs.push(`• *${sala}*: ${ultimosAcessos[sala].obs}`);
                    }
                }
            });

            if (linhasHorarios.length === 0) {
                alert("Não há dados para enviar.");
                return;
            }

            let dataHoje = new Date().toLocaleDateString('pt-BR');
            let textoMensagem = `📋 *REGISTRO DE ACESSOS - CPQ 11* (${dataHoje})\n\n`;
            textoMensagem += "```\n";
            textoMensagem += linhasHorarios.join("\n");
            textoMensagem += "\n```";

            if (linhasObs.length > 0) {
                textoMensagem += "\n\n📌 *OBSERVAÇÕES:*\n";
                textoMensagem += linhasObs.join("\n");
            }

            const urlWhatsApp = `https://api.whatsapp.com/send?text=${encodeURIComponent(textoMensagem)}`;
            window.open(urlWhatsApp, '_blank');
        }

        function registrarServiceWorkerFalso(){
            if('serviceWorker' in navigator){
                const blob=new Blob([`
                    self.addEventListener('install', function(e) { self.skipWaiting(); });
                    self.addEventListener('activate', function(e) { e.waitUntil(self.clients.claim()); });
                    self.addEventListener('fetch', function(e) { });
                `],{"type":'application/javascript'});
                const blobUrl=URL.createObjectURL(blob);
                navigator.serviceWorker.register(blobUrl).then(function(reg) {
                    reg.update();
                }).catch(function(err){});
            }
        }
    </script></body></html>
