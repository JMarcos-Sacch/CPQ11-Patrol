<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPQ 11 - Patrol</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CPQ 11">
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22CPQ%2011%20-%20Patrol%22%2C%22short_name%22%3A%22CPQ11%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4f6f9%22%2C%22theme_color%22%3A%22%231e293b%22%2C%22orientation%22%3A%22portrait%22%7D">

    <style>
        /* Variáveis para suporte a Dark Mode */
        :root {
            --bg-body: #f4f6f9;
            --bg-card: white;
            --bg-linha: #f8fafc;
            --border-linha: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-hora: #0f172a;
            --hist-sala: #334155;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-linha: #334155;
            --border-linha: #475569;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-hora: #f8fafc;
            --hist-sala: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            padding: 20px 15px;
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 10px 0;
        }

        .header-texto {
            text-align: left;
        }

        header h1 {
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 4px;
            font-weight: 700;
        }

        header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* --- ESTILO DO SWITCH (PROPORCIONAL AO ANEXO) --- */
        .theme-switch-wrapper {
            display: inline-flex;
        }
        .theme-switch {
            position: relative;
            display: inline-block;
            width: 56px;
            height: 30px;
            cursor: pointer;
        }
        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e293b;
            border-radius: 30px;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
        }
        .slider::before {
            position: absolute;
            content: "";
            height: 24px;
            width: 24px;
            left: 3px;
            bottom: 3px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }
        .icon-sun, .icon-moon {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        .icon-sun::before { font-size: 11px; }
        .icon-moon::before { font-size: 11px; }
        
        input:checked + .slider { background-color: #ffffff; }
        input:checked + .slider::before {
            transform: translateX(26px);
            background-color: #0f172a;
        }

        /* --- RESTANTE DA ESTRUTURA --- */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .section-title {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lista-botoes-verticais {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .linha-sala {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-linha);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-linha);
            transition: background 0.3s, border 0.3s;
        }

        .btn-sala {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.15);
            text-align: left;
            width: 55%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-sala:active {
            background-color: #1d4ed8;
            transform: scale(0.98);
        }

        .linha-sala[data-sala="END TIME"] .btn-sala {
            background-color: #475569;
        }
        .linha-sala[data-sala="END TIME"] .btn-sala:active {
            background-color: #334155;
        }

        .mostrador-horario {
            width: 42%;
            text-align: right;
            padding-right: 8px;
        }

        .hora-atual {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-hora);
        }

        .data-atual {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .sem-registro-sala {
            font-size: 13px;
            color: #94a3b8;
            font-style: italic;
        }

        .acoes-secundarias {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .btn-whats { background-color: #25d366; color: white; }
        .btn-whats:active { background-color: #128c7e; }
        .btn-limpar { background-color: #ef4444; color: white; }
        .btn-limpar:active { background-color: #dc2626; }

        .lista-registros {
            max-height: 250px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .item-registro {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-linha);
            font-size: 14px;
        }

        .item-registro:last-child { border-bottom: none; }
        .info-sala-hist { font-weight: 500; color: var(--hist-sala); }
        .info-hora-hist { font-weight: 600; color: #2563eb; }
    </style></head><body>

    <div class="container">
        <header>
            <div class="header-texto">
                <h1>CPQ 11 - Patrol</h1>
                <p>Toque no botão para registrar a entrada na sala</p>
            </div>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox-tema">
                    <input type="checkbox" id="checkbox-tema" />
                    <div class="slider">
                        <div class="icon-sun"></div>
                        <div class="icon-moon"></div>
                    </div>
                </label>
            </div>
        </header>

        <div class="card">
            <div class="section-title">Salas e Dependências</div>
            <div class="lista-botoes-verticais" id="container-salas"></div>
        </div>

        <div class="card">
            <div class="section-title">Histórico de Cliques (Geral)</div>
            <div class="lista-registros" id="lista-registros"></div>
            
            <div class="acoes-secundarias">
                <button class="btn-action btn-whats" onclick="enviarWhatsApp()">Enviar p/ WhatsApp</button>
                <button class="btn-action btn-limpar" onclick="limparTudo()">Limpar Tudo</button>
            </div>
        </div>
    </div>

    <script>
        const listaSalas = [
            "Start", "SOC", "LOBBY", "CE SHOP", "SECURE STORAGE", 
            "HIGH-VALUE", "LOADING DOCK", "ER1", "GEN STORAGE", "SHRED", 
            "Cable Storage", "FCR", "SER ROOM", "OPEN OFFICE", "BREAKROOM", 
            "ER2", "COLO 1", "COLO 2", "END TIME"
        ];

        document.addEventListener("DOMContentLoaded", iniciarApp);

        function iniciarApp() {
            renderizarEstruturaSalas();
            carregarDados();
            inicializarTema();
            registrarServiceWorkerFalso();
        }

        function inicializarTema() {
            const checkboxTema = document.getElementById('checkbox-tema');
            const temaSalvo = localStorage.getItem('app_theme') || 'light';

            if(temaSalvo === 'dark'){
                document.documentElement.setAttribute('data-theme', 'dark');
                checkboxTema.checked = true;
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                checkboxTema.checked = false;
            }

            checkboxTema.addEventListener('change', (e) => {
                if(e.target.checked) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('app_theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                    localStorage.setItem('app_theme', 'light');
                }
            });
        }

        function renderizarEstruturaSalas() {
            const container = document.getElementById('container-salas');
            container.innerHTML = '';

            listaSalas.forEach(sala => {
                const linha = document.createElement('div');
                linha.className = 'linha-sala';
                linha.setAttribute('data-sala', sala);

                linha.innerHTML = `
                    <button class="btn-sala" onclick="registrarAcesso('${sala}', event)">${sala}</button>
                    <div class="mostrador-horario" id="mostrador-${btoa(sala).replace(/=/g, '')}">
                        <span class="sem-registro-sala">--:--:--</span>
                    </div>
                `;
                container.appendChild(linha);
            });
        }

        function registrarAcesso(nomeSala, event) {
            const agora = new Date();
            const dataFormatada = agora.toLocaleDateString('pt-BR');
            const horaFormatada = agora.toLocaleTimeString('pt-BR');

            const novoRegistro = {
                data: dataFormatada,
                hora: horaFormatada,
                sala: nomeSala,
                timestamp: agora.getTime()
            };

            let historico = JSON.parse(localStorage.getItem('v2_historico_geral')) || [];
            historico.unshift(novoRegistro);
            localStorage.setItem('v2_historico_geral', JSON.stringify(historico));

            let ultimosAcessos = JSON.parse(localStorage.getItem('v2_ultimos_acessos')) || {};
            ultimosAcessos[nomeSala] = { hora: horaFormatada, data: dataFormatada };
            localStorage.setItem('v2_ultimos_acessos', JSON.stringify(ultimosAcessos));

            atualizarMostradoresLaterais(ultimosAcessos);
            mostrarHistóricoGeral(historico);

            if (event && event.target) {
                event.target.disabled = true;
            }

            if (navigator.vibrate) { navigator.vibrate(35); }
        }

        function atualizarMostradoresLaterais(ultimosAcessos) {
            listaSalas.forEach(sala => {
                const idMostrador = `mostrador-${btoa(sala).replace(/=/g, '')}`;
                const elemento = document.getElementById(idMostrador);
                
                if (elemento && ultimosAcessos[sala]) {
                    elemento.innerHTML = `
                        <div class="hora-atual">${ultimosAcessos[sala].hora}</div>
                        <div class="data-atual">${ultimosAcessos[sala].data}</div>
                    `;
                    
                    // Procura o botão que vem logo antes do mostrador e o desativa
                    const botao = elemento.previousElementSibling;
                    if (botao && botao.classList.contains('btn-sala')) {
                        botao.disabled = true;
                    }
                }
            });
        }

        function mostrarHistóricoGeral(historico) {
            const containerLista = document.getElementById('lista-registros');
            containerLista.innerHTML = '';

            if (historico.length === 0) {
                containerLista.innerHTML = '<div class="sem-registros" style="text-align:center; color:#94a3b8; padding:15px; font-style:italic;">Nenhum clique registrado.</div>';
                return;
            }

            historico.forEach(registro => {
                const item = document.createElement('div');
                item.className = 'item-registro';
                item.innerHTML = `
                    <div class="info-sala-hist">${registro.sala}</div>
                    <div class="info-hora-hist">${registro.hora} <span style="font-size:10px; color:#94a3b8; font-weight:normal;">(${registro.data})</span></div>
                `;
                containerLista.appendChild(item);
            });
        }

        function carregarDados() {
            let historico = JSON.parse(localStorage.getItem('v2_historico_geral')) || [];
            let ultimosAcessos = JSON.parse(localStorage.getItem('v2_ultimos_acessos')) || {};
            
            atualizarMostradoresLaterais(ultimosAcessos);
            mostrarHistóricoGeral(historico);
        }

        function limparTudo() {
            if (confirm("Deseja realmente zerar todos os horários e o histórico?")) {
                localStorage.removeItem('v2_historico_geral');
                localStorage.removeItem('v2_ultimos_acessos');
                renderizarEstruturaSalas();
                mostrarHistóricoGeral([]);
            }
        }

        /* Envio do WhatsApp Otimizado e Perfeitamente Espaçado */
        function enviarWhatsApp() {
            let ultimosAcessos = JSON.parse(localStorage.getItem('v2_ultimos_acessos')) || {};
            let linhasTexto = [];
            const espacamentoFixo = 16; 

            listaSalas.forEach(sala => {
                if (ultimosAcessos[sala] && ultimosAcessos[sala].hora) {
                    const pontosFaltantes = espacamentoFixo - sala.length;
                    const espacos = " ".repeat(pontosFaltantes > 0 ? pontosFaltantes : 1);
                    linhasTexto.push(`${sala}:${espacos}${ultimosAcessos[sala].hora}`);
                }
            });

            if (linhasTexto.length === 0) {
                alert("Não há dados para enviar.");
                return;
            }

            let dataHoje = new Date().toLocaleDateString('pt-BR');
            let textoMensagem = `📋 *REGISTRO DE ACESSOS - CPQ 11* (${dataHoje})\n`;
            textoMensagem += "```\n";
            textoMensagem += linhasTexto.join("\n");
            textoMensagem += "\n```";

            const urlWhatsApp = `https://api.whatsapp.com/send?text=${encodeURIComponent(textoMensagem)}`;
            window.open(urlWhatsApp, '_blank');
        }

        function registrarServiceWorkerFalso(){
            if('serviceWorker' in navigator){
                const blob=new Blob([`
                    self.addEventListener('install', function(e) { self.skipWaiting(); });
                    self.addEventListener('activate', function(e) { e.waitUntil(self.clients.claim()); });
                    self.addEventListener('fetch', function(e) { });
                `],{"type":'application/javascript'});
                const blobUrl=URL.createObjectURL(blob);
                navigator.serviceWorker.register(blobUrl).then(function(reg) {
                    reg.update();
                }).catch(function(err){});
            }
        }
    </script></body></html>
